<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Liquidação Judicial</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Liquidação de Sentença</h1>
        <button id="theme-toggle">Modo Escuro</button>
    </header>

    <main class="container">
        <nav class="tabs">
            <button class="tab-btn active" data-target="parametros">Parâmetros</button>
            <button class="tab-btn" data-target="lancamentos">Lançamentos</button>
            <button class="tab-btn" data-target="depositos">Depósitos Judiciais</button>
            <button class="tab-btn" data-target="relatorio">Evolução & Relatório</button>
        </nav>

        <section id="parametros" class="tab-content active">
            <h2>Parâmetros Gerais do Cálculo</h2>
            <form id="form-parametros">
                <div class="form-group">
                    <label>Data de Atualização (Data Final):</label>
                    <input type="month" id="data-final" required>
                </div>
                <div class="form-group">
                    <label>Índice de Correção:</label>
                    <select id="indice-correcao">
                        <option value="IPCA-E">IPCA-E</option>
                        <option value="INPC">INPC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Juros Moratórios (% ao mês):</label>
                    <input type="number" step="0.1" id="juros-mensais" value="1.0">
                </div>
                <div class="form-group">
                    <label>Termo Inicial dos Juros:</label>
                    <input type="month" id="termo-juros">
                </div>
            </form>
        </section>

        <section id="relatorio" class="tab-content">
            <h2>Memória de Cálculo e Evolução Mensal</h2>
            <button id="btn-calcular" class="btn-primary">Gerar Cálculo</button>
            
            <div class="table-responsive">
                <table id="tabela-evolucao">
                    <thead>
                        <tr>
                            <th>Competência</th>
                            <th>Valor Histórico</th>
                            <th>Fator Acumulado</th>
                            <th>Principal Corrigido</th>
                            <th>Juros Moratórios</th>
                            <th>Subtotal</th>
                            <th>Depósito (Abatimento)</th>
                            <th>Saldo Remanescente</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="7"><strong>Total Devido:</strong></td>
                            <td id="total-final">R$ 0,00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
            <div class="export-actions">
                <button id="btn-export-pdf">Exportar PDF</button>
                <button id="btn-export-excel">Exportar Excel (CSV)</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/ui/app.js"></script>
</body>
</html>
